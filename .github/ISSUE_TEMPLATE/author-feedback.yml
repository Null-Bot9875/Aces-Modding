name: MOD 作者体验反馈 / Author feedback
description: 反馈安装、编辑、启动、调试或完成内容闭环时遇到的问题。
title: "[Author Feedback] "
labels:
  - author-feedback
body:
  - type: textarea
    id: goal
    attributes:
      label: 制作目标 / Creation goal
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: 遇到的阻塞 / Blocking point
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 复现步骤与日志 / Reproduction steps and logs
      description: 请移除敏感信息。Remove sensitive information before submitting.
