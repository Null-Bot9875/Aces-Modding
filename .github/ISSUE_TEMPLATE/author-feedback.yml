name: MOD 作者体验反馈 / Author feedback
description: 反馈安装、编辑、启动、调试或完成内容闭环时遇到的问题。
title: "[Author Feedback] "
labels:
  - author-feedback
body:
  - type: input
    id: version
    attributes:
      label: 游戏版本 / Game version
    validations:
      required: true
  - type: dropdown
    id: content
    attributes:
      label: 使用的入口 / Starting point
      options:
        - card-pack
        - node-pack
        - Documentation only
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 制作目标 / Creation goal
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: 遇到的阻塞 / Blocking point
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 复现步骤与日志 / Reproduction steps and logs
      description: 包含操作系统、MOD 目录树和启用顺序；移除敏感信息。Include the OS, MOD directory tree, and enabled order; remove sensitive information.
